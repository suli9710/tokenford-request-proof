[package]
name = "tokenford-user-verifier-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tlsn = { path = "../tlsn/crates/tlsn", features = ["mozilla-certs"] }
anyhow = "=1.0.100"
tokio = { version = "=1.48.0", features = ["full"] }
tokio-util = { version = "=0.7.16", features = ["compat"] }
futures = "=0.3.31"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hex = "=0.4.3"
base64 = "=0.22.1"
rand = "=0.9.2"
rangeset = "=0.4.1"

[profile.release]
opt-level = 2

